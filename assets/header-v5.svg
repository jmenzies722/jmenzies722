<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 176" width="1200" height="176" role="img" aria-label="Josh Menzies — Platform Engineer. Agent infrastructure — MCP servers, guardrails, developer platforms. New York.">
  <defs>
    <style>
      .n { font-family: 'Helvetica Neue', -apple-system, 'Segoe UI', Arial, sans-serif; font-weight: 700; }
      .t { font-family: 'Helvetica Neue', -apple-system, 'Segoe UI', Arial, sans-serif; font-weight: 400; }
      .k { font-family: 'Helvetica Neue', -apple-system, 'Segoe UI', Arial, sans-serif; font-weight: 500; }
    </style>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.16"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="176" fill="#0a0a0a"/>

  <g transform="translate(1020,88)" stroke="url(#fade)" fill="none" stroke-width="1.1" stroke-linejoin="round">
    <polygon points="0,-58 92,-21 0,17 -92,-21"/>
    <polygon points="0,-34 92,3 0,41 -92,3"/>
  </g>

  <text x="72" y="80" class="n" font-size="46" fill="#fafafa" letter-spacing="-1">Josh Menzies</text>
  <text x="72" y="112" class="t" font-size="17" fill="#9aa2ab" letter-spacing="0.1">I build the layer AI agents run on.</text>
  <text x="72" y="146" class="k" font-size="12.5" fill="#6e7681" letter-spacing="1.8">PLATFORM ENGINEERING &#160;/&#160; AGENT INFRASTRUCTURE &#160;/&#160; NEW YORK</text>
</svg>
